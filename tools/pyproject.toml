[project]
name = "tcgtools"
version = "0.1.0"
description = "Automatización ADB + comparación visual (OpenCV) para verificar fidelidad 1:1 del clon de Pokémon TCG Live"
requires-python = ">=3.9"
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "scikit-image>=0.21",
    "Pillow>=10.0",
    "click>=8.1",
    "PyYAML>=6.0",
]

[project.scripts]
tcgtools = "tcgtools.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tcgtools"]
