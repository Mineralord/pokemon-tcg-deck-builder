  - {from: "openCardContextMenu (menú por zona)", to: "CardDetailOverlay/ActiveActionSheet (GameScreen)", note: "En vez de menú desktop por click derecho, hoja de acciones táctil que muestra SÓLO acciones legales (del motor). Ya lo haces para el Activo (AttackRow/EnergyOrbs)."}
