# -------------------------------------------------------------------------------------
design_decisions:
  - decision: "DOM como estado (cartas = <img> con props)."
    evidence: move-card.js, attach-card.js
    rationale_hypothesis: "Máxima simplicidad para un simulador manual sin reglas; el navegador ya posiciona/renderiza."
    pros: ["cero capa de render aparte", "cualquier carta funciona sin datos"]
    cons: ["estado no serializable directo", "desyncs (refreshBoard)", "difícil de testear/razonar"]
    confidence: high
  - decision: "Sin motor de reglas (simulador manual)."
    evidence: "attack/pass sólo loguean; damageCounter contentEditable"
    rationale_hypothesis: "Cubrir TODO el juego (todas las cartas, interacciones raras) sin programar efectos; el jugador es el árbitro."
    pros: ["cobertura universal instantánea", "sin mantenimiento por set nuevo"]
    cons: ["sin automatización/IA", "cero validación/anti-trampa", "mucho trabajo manual por turno"]
    confidence: high
  - decision: "Event-sourcing con envelope genérico + counters."
    evidence: process-action.js, accept-action.js, server.js:245(comentados)
    rationale_hypothesis: "Evolucionó de eventos granulares a un envelope: añadir acciones sin tocar servidor; habilita undo/replay/spectator gratis."
    pros: ["extensible", "undo/replay/spectator/import de un solo mecanismo"]
    cons: ["orden estricto por counter (huecos → resync)", "cap de log 30 (bug)", "replay caro re-ejecuta DOM"]
    confidence: high
  - decision: "Dos iframes self/opp."
    evidence: global-variables.js:12, index.ejs:34
    rationale_hypothesis: "Aislar DOM/ids/estilos y espejar la mitad rival; simplificar flip-board."
    pros: ["reutiliza el mismo markup de tablero para ambos lados", "flip = swap de contenedores"]
    cons: ["complejidad de cruce contentWindow", "posicionamiento de menús/counters con offsets", "flip-board/refreshBoard enormes"]
    confidence: med
  - decision: "Split-view desktop redimensionable."
    evidence: sizing/resizer.js
    rationale_hypothesis: "Público de escritorio con ratón; ver ambas manos/tableros a la vez y ajustar proporción."
    pros: ["control fino del espacio"]
    cons: ["no móvil", "layout por coordenadas frágil"]
    confidence: high

# -------------------------------------------------------------------------------------
critique:   # qué conservar / cambiar / modernizar (para el rediseño de TU app)
  keep:
    - "El VOCABULARIO de manipulación manual: menú contextual por zona, mover/adjuntar/evolucionar por arrastre, contadores de daño/condición sobre la carta, reveal/hide/look-at, zoom por doble-click."
    - "El PATRÓN event-sourcing (log + counter + catch-up/resync/replay/spectator/export-key) como capa de reconexión/replay/espectador."
    - "La riqueza de affordances 'de mesa' que un juego automatizado suele olvidar (mirar mazo, barajar, poner boca abajo, dejar cartas en juego, mover premios)."
  change:
    - "Estado en DOM → estado tipado único (TU app ya lo tiene: GameState). Nunca portar el modelo DOM."
    - "Sin autoridad → mantener host-autoritativo. Las acciones manuales de PTCG Sim deben pasar por el motor como intents o como 'acciones libres' auditadas, no como mutaciones ciegas."
    - "refreshBoard/flip-board imperativos → recomposición declarativa Compose (ya es así en tu app)."
  modernize:
    - "Animación de movimiento de carta (PTCG Sim casi no tiene) → tweens de posición, como ya haces con reparto/revelado."
    - "Menú contextual desktop → hoja de acciones/bottom-sheet táctil (tu CardDetailOverlay/ActiveActionSheet)."
    - "Counters contentEditable → controles táctiles (+/- daño, chips de condición)."
  remove:
    - "Honor system de info oculta → tu servidor ya censura (GameState.toDtoFor)."
    - "Duplicación self/opp CSS e iframes → un solo árbol declarativo con perspectiva por parámetro."

