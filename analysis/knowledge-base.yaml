# BASE DE CONOCIMIENTO — Ingeniería inversa de PTCG Sim (UI/UX/arquitectura)
# + comparación y plan de migración a TCG-Live-Clone
#
# Formato: conocimiento denso estructurado orientado a relaciones (NO documentación
# narrativa). Pensado para que otro modelo lo convierta en docs. Cada afirmación
# relevante lleva evidencia (archivo[:línea]) y `confidence` (high|med|low).
# `read: full` = archivo leído íntegro; `read: grep` = muestreado; `read: inferred`
# = rol deducido por nombre/imports/vecindad (marcar como hipótesis).
# =====================================================================================

meta:
  source_repo: "ptcg-sim-main (PTCG Sim, ptcgsim.online)"
  source_path: "C:/DOCUMENTOS/POKÉMON TCG/ZIP DE REPOS/PTCG Sim/ptcg-sim-main"
  version: "1.5.1"                      # global-variables.js:5
  authors: "Michael / Xiao Xiao"        # server.js:172 (mensaje de error)
  analyzed_at: "2026-07-11"
  analyst: "claude-opus (sesión TCG-Live-Clone)"
  size: {files: 157, js_modules: ~132, js_kb: ~578, index_ejs_kb: 74, server_kb: 9, css_kb: 62}
  target_repo: "TCG-Live-Clone (Kotlin/Compose, motor puro autoritativo)"
  methodology: >
    Lectura directa (no subagentes) de la 'espina' (bootstrap, estado, move-card,
    netcode/event-sourcing, hidden-info, counters, flip-board, lobby, CSS, sizing)
    + contratos de la app propia (GameIntent, NetMessage, GameController, GameUiState,
    inventario de composables de GameScreen). Cobertura de las 10 dimensiones del plan.
  golden_rule: >
    El motor de TCG-Live-Clone permanece AUTORITATIVO. De PTCG Sim se mina el
    VOCABULARIO de UX/interacción y el patrón de event-sourcing, NUNCA su modelo de
    estado (DOM) ni su ausencia de reglas. Las 'acciones' de PTCG Sim se traducen a
    intents/afordancias/FX, no a mutaciones de DOM.

# -------------------------------------------------------------------------------------
glossary:
  - term: zone
    def: "Una de 10 zonas por lado + stadium neutral. Cada zona = {array JS de cartas, element DOM, elementCover?, getCount()}."
    ref: setup/zones/get-zone.js
  - term: card (objeto)
    def: "{name, type, type2?, image}. `image` es un <img> DOM que porta estado ad-hoc: attached, target('on'|'off'), relative(img padre), layer, energyLayer, faceDown, public, src2/alt2(cara oculta), user, damageCounter, specialCondition, abilityCounter, PokémonBreak."
    ref: move-card.js, attach-card.js, reveal-and-hide.js
  - term: action
    def: "Función mutadora (actions/**) que manipula DOM+arrays y termina llamando processAction(user,emit,name,params). Es a la vez comando de UI y unidad de replicación/log."
  - term: initiator
    def: "El usuario de la mitad inferior de la pantalla ('self' si selfContainer tiene la clase 'self'). Cambia con flip-board."
    ref: global-variables.js:31
  - term: user ('self'|'opp')
    def: "Dueño lógico de la zona/carta, independiente de qué mitad se ve. En 2p el rival es siempre 'opp'."
  - term: container (self/opp)
    def: "IFRAME (selfContainer/oppContainer). Su contentWindow.document aloja el DOM del tablero de ese lado. stadium vive en el documento principal."
    ref: global-variables.js:12-15
  - term: counter (contador)
    def: "Overlay DOM contentEditable sobre una carta: damageCounter (nº de daño), specialCondition (letra P/B/A/PA/C con color), abilityCounter."
  - term: action log
    def: "systemState.{self,opp,export,replay}ActionData[] + contadores {self,opp,spectator}Counter. Fuente de verdad para replicar/undo/replay/spectator."

# -------------------------------------------------------------------------------------
architecture:
  paradigm:
    summary: "Vanilla JS + Vite, SIN framework, SIN virtual DOM. Manipulación imperativa directa del DOM. Las cartas SON nodos DOM, sombreadas por arrays por zona."
    no_engine: "NO hay motor de reglas ni validación de legalidad. Es un SIMULADOR MANUAL (mesa física digital): el usuario mueve cartas libremente; el 'juego' no impone reglas."
    authority: "P2P SIN autoridad. Cada cliente aplica el mismo stream de acciones y confía en converger (de ahí syncCheck/resync/refreshBoard)."
    confidence: high
  bootstrap:
    entry: client/src/front-end.js
    order: [initializeSocketEventListeners, initializeDOMEventListeners, initializeMutationObservers, loadImportData]
    note: "front-end.js re-exporta global-variables (side-effect: crea socket, iframes refs, systemState, mouseClick, fondo)."
    ref: front-end.js:1-12
  layers:
    - name: state
      resp: "systemState (sesión/meta+logs), mouseClick (selección), arrays por zona (get-zone), DOM (posición/visibilidad real)."
      files: [global-variables.js, get-zone.js]
    - name: actions
      resp: "Comandos mutadores; cada uno = manipulación DOM/array + battle-log + processAction."
      files: ["actions/**"]
    - name: interaction
      resp: "Puntero (click/drag), teclado (keybinds), menú contextual por zona."
      files: [image-logic/click-events.js, image-logic/drag.js, actions/keybinds/*, card-context-menu/**]
    - name: netcode/event-sourcing
      resp: "processAction (out) + acceptAction (in) + sync/resync/catchup/spectator/replay/undo."
      files: [socket-event-listeners.js, "setup/general/*", server.js]
    - name: reactive (secundaria)
      resp: "MutationObservers para scroll/reflow/contadores (NO es el binding estado→vista principal)."
      files: ["mutation-observers/*"]
    - name: sizing/responsive
      resp: "Split-view desktop redimensionable + reflow por coordenadas calculadas."
      files: [sizing/resizer.js, sizing/refresh-board.js, sizing/adjust-alignment.js]
    - name: ui-shell
      resp: "index.ejs (DOM completo) + 2 iframes + sidebox + menús/modales."
      files: [index.ejs, self-containers.html, opp-containers.html, "document-event-listeners/sidebox/**", "table/**"]
    - name: deckbuilder
      resp: "Construcción/importación de mazos (2 generaciones)."
      files: ["setup/deck-builder/**", "setup/deck-constructor/**"]
  data_representation:
    dual_model: "Estado = arrays por zona (orden lógico) + nodos DOM (posición/visibilidad) + props ad-hoc en cada <img>. NO hay una estructura de estado única serializable; el 'estado' se reconstruye replicando el log de acciones."
    serialization: "No se serializa el estado; se serializa el LOG (exportActionData) para replay/import. Import = replay del log en un tablero limpio."
    smell: "Estado disperso DOM↔array↔props → fuente de desyncs (mitigado con refreshBoard tras cada movimiento)."
    confidence: high

