rendering:
  strategy: "Imperativo. moveCard hace appendChild/splice directo — SIN animación de movimiento. El 'binding estado→vista' lo hacen las acciones a mano, no un sistema reactivo."
  mutation_observers:
    ref: initialization/mutation-observers/*
    role: "Capa reactiva SECUNDARIA (no el binding principal)."
    board-observer: "childList → auto-scroll al fondo cuando entran cartas. [board-observer.js, full]"
    hand-observer/prizes-observer/stadium-observer: "reflow/scroll/mirror de esas zonas. [read:inferred/med]"
  sizing_responsive:
    ref: setup/sizing/resizer.js, refresh-board.js, adjust-alignment.js
    model: "DESKTOP split-view: divisor arrastrable (selfResizer/oppResizer) cambia alturas de los iframes como % de innerHeight; overlay captura el ratón durante el drag; window.resize refluye. Layout de cartas por coordenadas calculadas (getBoundingClientRect), no por flujo CSS."
    opp_view_trick: "El rival se pinta girado 180° con transform scaleX(-1) scaleY(-1). [css:*:68,220]"
    implication: "Orientado a pantalla ancha con ratón. NO es responsive móvil vertical."

