# =====================================================================================
integration_master_plan:
  principles:
    - "El motor (:engine:*) es intocable y autoritativo. PTCG Sim sólo aporta UX y el patrón event-sourcing."
    - "Toda acción del usuario = GameIntent validado por el motor. Nada de 'mutaciones libres' de estado."
    - "No duplicar lógica PvE/PvP: todo entra por GameController/GameCore (regla ya vigente en tu napkin)."
    - "Móvil vertical declarativo: descartar iframes/split-view/flip-board/CSS self-opp."
    - "Animación de game-feel es un diferenciador: invertir donde PTCG Sim no invirtió."
  phases:
    - phase: 0
      title: "Consolidar el vocabulario UX (sin red)"
      work: "Auditar affordances 'de mesa' que faltan vs PTCG Sim: mirar mazo/premios, barajar zona, poner boca abajo, mover premios, contadores de condición como chips. Exponerlas como intents o PendingDecision del motor."
      risk: "Añadir intents nuevos exige soporte del motor; priorizar los que ya son legales."
    - phase: 1
      title: "Hoja de acciones contextual por zona"
      work: "Generalizar CardDetailOverlay a un 'action sheet' por zona (activo/banca/mano/descarte/premios) que liste SÓLO acciones legales (derivadas de legalIntents). Sustituye el menú contextual desktop."
      reuse: [CardDetailOverlay, DecisionPanel, handAction, isValidDrop]
    - phase: 2
      title: "Overlays de estado de solo-lectura"
      work: "Daño/condiciones/marcadores de habilidad como overlays alimentados por GameState (no editables). Evitar el contentEditable de PTCG Sim."
      reuse: [ActiveInBox, BenchRow, EnergyOrbs]
    - phase: 3
      title: "Pulido de game-feel (animación)"
      work: "Tweens de movimiento de carta entre zonas, ataque/KO, robo. PTCG Sim carece de esto; es donde más se gana."
      reuse: [FxCue, FlipCard, TurnArc, CoinTossOverlay]
    - phase: 4
      title: "Event-sourcing sobre snapshots (reconexión/replay/espectador)"
      work: >
        Adoptar el patrón de PTCG Sim ADAPTADO a host-autoritativo: el host ya numera
        Snapshot(seq). Añadir (a) log de snapshots/intents en el host, (b) catch-up por
        seq (ya tienes RequestSnapshot + descarte de seq viejos), (c) modo espectador
        (host emite snapshots censurados a espectadores), (d) export/replay: persistir
        la secuencia de snapshots o intents y reproducirla. NO copiar el cap de 30 ni el
        replay que re-ejecuta DOM; reproducir aplicando snapshots o re-simulando intents
        en el motor determinista (ventaja tuya: es reproducible de verdad).
      reuse: [NetMessage.Snapshot, NetMessage.RequestSnapshot, MatchTransport, FirestoreMatchTransport]
      risk: "Definir la fuente de replay: snapshots (simple, pesado) vs intents+semilla RNG (ligero, exige RNG determinista reproducible)."
    - phase: 5
      title: "Chat + social online"
      work: "Chat en sala + (rumbo ya elegido) amigos/invitaciones. Log ya existe (LogLine)."
  anti_debt:
    - "No portar código JS de PTCG Sim; portar CONCEPTOS."
    - "Cada affordance nueva pasa por el motor (intent/decision), test JVM incluido."
    - "Un solo árbol declarativo con perspectiva por parámetro (nada de self/opp duplicado)."
  decoupling_strategy:
    - "UX ↔ motor sólo vía GameController (ui/fx/onIntent/onResolve). PTCG Sim demuestra el catálogo de affordances; el motor decide legalidad."
    - "Transporte (event-sourcing) ↔ juego vía NetMessage/MatchTransport; el replay se re-simula en el motor, no en la UI."

