  keybinds:
    ref: actions/keybinds/keybinds.js (16.7KB, read:grep)
    model: "Capa de teclado completa que replica el menú contextual sobre la carta seleccionada (mouseClick). Gated por modifiers y sleep (keybindSleep evita spam durante recepción de acciones remotas)."
    sample_keys: {Esc: cerrar, f+Alt: flip, r: rotar, v: ver/zoom, arrows: mover activo/banca, e: evolucionar, y+letra: condición especial (P/B/PA/C/A), z: undo, u: '?', m: '?', d/s/t/p/n: acciones-zona, Enter: chat, '/': foco-chat}
    confidence: med   # mapa exacto no verificado 1:1
  hidden_info:
    ref: actions/general/reveal-and-hide.js
    core: "toggleCard intercambia img.src↔img.src2 (frente↔dorso) + flags faceDown/public."
    ops: [lookAtCards(zona privada al iniciador), stopLookingAtCards, revealCards/hideCards(zona al rival), revealShortcut/hideShortcut(carta única), lookShortcut/stopLookingShortcut, playRandomCardFaceDown]
    perspective: "Cada op se re-emite al peer con self↔opp invertido + socketId (para corregir la vista del espectador)."
    ux_detail: "Revelar carta de tu propia mano → popup 'Press OK to stop revealing card to opponent'."
    enforcement: "NINGUNO por servidor: honor system. prizes siempre oculto; hand oculto a rival por checkbox hideHandCheckbox."

