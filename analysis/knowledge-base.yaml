# COMPARACIÓN E INTEGRACIÓN CON TCG-LIVE-CLONE
# =====================================================================================
comparison_tcg_live_clone:
  paradigm_delta:
    ptcgsim: {ui: "DOM imperativo", state: "DOM+arrays+props", authority: "P2P sin autoridad", engine: "ninguno (manual)", net: "event-sourcing P2P", platform: "desktop/ratón"}
    clone: {ui: "Compose declarativo", state: "GameState tipado (fuente única)", authority: "host-autoritativo", engine: "puro determinista :engine:*", net: "snapshots censurados + intents", platform: "móvil vertical"}
  clone_contracts:
    GameIntent:
      ref: engine/rules/GameIntent.kt
      intents: [PlayBasicToBench, Evolve, AttachEnergy, AttachTool, Retreat, PromoteActive, Attack, PlayTrainer, UseAbility, ResolveDecision, EndTurn]
      rule: "motor valida; ilegal se rechaza sin mutar. Con decisión pendiente (interaction!=null) sólo acepta ResolveDecision."
    NetMessage:
      ref: data/netplay/NetMessage.kt
      msgs: [Hello, Intent(guest→host), Snapshot(seq,censored), RequestSnapshot, CoinCall, CoinResult, ChooseOrder, SetupChoice, Ceremony, Deal, LogLine, Fx, Bye]
    GameController:
      ref: feature/game/GameController.kt
      surface: "ui:StateFlow<GameUiState>, fx:SharedFlow<FxCue>, ceremonia(chooseCoin/First/Active/toggleBench/confirmSetup), onIntent/onResolve, playItemOn(atómico item+objetivo), cardName/card. Implementado por GameViewModel(PvE) y OnlineGameViewModel(PvP)."
    GameUiState:
      ref: feature/game/GameViewModel.kt:32
      fields: [loading, state:GameState, coinFlip, dealing, setup, revealing, log, message, aiThinking]
    composables:
      ref: feature/game/GameScreen.kt
      inventory: [TurnArc, CoinTossOverlay, DragGhost, BenchRow, OpponentHandFan, ActiveInBox, FlipCard, RevealActive/RevealBench, SetupPrompt, LogButton, RevealAttachTray, SearchRevealOverlay, DiscardPanelOverlay, DecisionPanel, CardDetailOverlay(+AttackRow+EnergyOrbs=ActiveActionSheet), ConfirmDialog, dropGlow, isValidDrop, handAction]
  engine_coupling_matrix:  # pieza PTCG Sim → ¿depende del motor? → transferible como
    - {ptcgsim: "menú contextual por zona", engine_dep: "sí (qué acciones son legales)", transfer_as: "afordancias derivadas de legalIntents/PendingDecision"}
    - {ptcgsim: "drag mover/adjuntar/evolucionar", engine_dep: "sí", transfer_as: "intents (AttachEnergy/Evolve/PlayBasicToBench) — YA existe en tu HandFan/dragCard"}
    - {ptcgsim: "damage/special-condition counters", engine_dep: "parcial (el motor ya trackea HP/estados)", transfer_as: "overlays de solo-lectura alimentados por GameState (no editables)"}
    - {ptcgsim: "reveal/hide/look-at", engine_dep: "sí (info oculta la controla el host)", transfer_as: "PendingDecision + overlays; el host decide qué se revela"}
    - {ptcgsim: "zoom doble-click", engine_dep: "no", transfer_as: "UX pura → ya tienes CardDetailOverlay/CardDetailDialog"}
    - {ptcgsim: "event-sourcing (undo/replay/spectator/export-key)", engine_dep: "no (capa de transporte)", transfer_as: "capa sobre tus Snapshots host-autoritativos"}
    - {ptcgsim: "chat + battle log", engine_dep: "no", transfer_as: "ya tienes log/LogLine; añadir chat"}
    - {ptcgsim: "flip-board / iframes / split-view / CSS self-opp", engine_dep: "no", transfer_as: "NADA (anti-patrón para móvil declarativo)"}

# component_mapping: PTCG Sim → composable/pantalla concreta de TU app + nota
