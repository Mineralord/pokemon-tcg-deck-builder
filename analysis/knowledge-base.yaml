      active/bench: [abilityCounter, damageCounter, specialCondition(solo active), change(type), move]
      prizes: [shufflePrizes, lookPrizes, revealHidePrizes, shufflePrizesToDeckBottom]
      hand: [lookHand(oppView), randomHand(oppView), discardHand(selfView), shuffleHand, shuffleHandBottom]
      deckCover: [shuffleDeck, draw(selfView), viewTop, viewBottom]
      board: [discardBoard, handBoard, shuffleBoard, lostZoneBoard]
