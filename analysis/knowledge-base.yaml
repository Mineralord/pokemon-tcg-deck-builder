action_system:
  invariants:
    signature: "(user, initiator?, ...params, emit=true)"
    two_player_delegation: "Patrón repetido: si user==='opp' && emit && isTwoPlayer → processAction(...) y return (delego al peer, no aplico local)."
    ends_with: "processAction(user, emit, name, params) y (si visible) appendMessage al battle log."
  core_primitive:
    moveCard:
      ref: actions/move-card-bundle/move-card.js
      role: "Primitiva maestra (~150 líneas). Splice origen→push destino; cover; reposiciona adjuntas; hide/reveal (prizes siempre oculto; hand oculto a rival si checkbox; faceDown); attach vs evolve vs move normal; auto-move active↔bench; bump stadium; relocate adjuntas; update counters; re-sort."
    moveCardBundle:
      ref: actions/move-card-bundle/move-card-bundle.js
      role: "Entrada 'de red' de moveCard: log + moveCard + refreshBoard() (anti-desync) + processAction. Es el intent de movimiento networked."
    attachCard:
      ref: actions/move-card-bundle/attach-card.js
      role: "Adjunta energía/herramienta a un Pokémon: posición absoluta relativa (left/bottom por layer/energyLayer), z-index decreciente, ensancha contenedor, sincroniza rotación, reordena herramientas al fondo."
  catalog:  # acción → grupo/archivo/rol/networked/undoable(via log)
    move-card-bundle:
      moveCardBundle: "mover/atacar/soltar carta (networked)."
      attachCard/evolveCard: "adjuntar / evolucionar (sub-rutas de moveCard)."
      relocateAttachedCards/updateAttachedCardsPosition: "las adjuntas siguen al padre."
      autoMoveActiveBenchCard: "swaps activo↔banca automáticos."
      initializeActiveBenchCard: "crea play-container con adjuntas."
      updateCounters/updateCover/updateStadiumCard/decreaseCardLayer: "sincronía de overlays/pilas/estadio/capas."
    zones (actions/zones):
      shuffleAll/shuffleBottom/discardAll/lostZoneAll/handAll/leaveAll/sort: "operaciones de zona en masa (loop moveCard) + log. [general.js]"
      deck-actions: "draw, moveToDeckTop, switchWithDeckTop, shuffleIntoDeck, viewDeck. [deck-actions.js, read:inferred/med]"
      hand-actions: "discardAndDraw, shuffleAndDraw, shuffleBottomAndDraw. [read:inferred]"
      prizes-actions: "shufflePrizesToDeckBottom. shuffle-zone: shuffleZone(indices)."
    counters (actions/counters):
      damage-counter: "add/update/removeDamageCounter — <div> contentEditable, el usuario TECLEA el daño; posición/tamaño proporcional a la carta; auto-remove si vacío/0. [damage-counter.js, full]"
      special-condition: "add/update/remove — letra P(verde)/B(rojo)/A(azul)/PA(amarillo)/C(morado), contentEditable. [special-condition.js, full]"
      ability-counter/use-ability/reset-counters: "marcadores de habilidad usada."
    general (actions/general):
      take-turn: "avanza turno: descarta board, reset ability counters, turn++, roba 1, revela facedown en juego. [take-turn.js, full]"
      flip-board: "intercambia qué lado es el inferior: togglea decenas de clases en ambos iframes + swap alturas + flip stadium + re-registra resizers. [flip-board.js, full]"
      reveal-and-hide: "info oculta (ver sección hidden_info). [full]"
      flip-coin, rotate-card, change-type, VSTAR-GX, board-actions(discard/hand/shuffle/lostZoneBoard), reset, setup, count, close-popups, undo.
    chat-buttons: "attack/pass (botones que sólo escriben en el log; no calculan daño)."
  observation: "attack/pass son SOLO mensajes de log — coherente con 'sin motor': el daño lo aplica el usuario a mano con damageCounter."

