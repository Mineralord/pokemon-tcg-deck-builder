interactions:
  three_input_paths:
    - "Click-para-seleccionar → click-en-destino = mover (imageClick). [click-events.js:208]"
    - "Drag & drop HTML5 nativo (dragstart/over/leave/drop). [image-logic/drag.js]"
    - "Menú contextual por zona (click derecho). [click-events.js:63 openCardContextMenu]"
  pointer:
    click-events:
      ref: setup/image-logic/click-events.js
      identifyCard: "rellena mouseClick a partir del target y su zona (maneja active/bench envueltos en contenedor, y covers)."
      imageClick: "si target resaltado → moveCardBundle; si no → resalta+selecciona."
      doubleClick: "ZOOM. En active/bench expande el play-container in-place (70%/69%, oculta counters). Fuera, crea overlay #fullImage a pantalla completa (backdrop 0.5, cierra con click/Esc/'v')."
    drag:
      ref: setup/image-logic/drag.js
      model: "dragStart baja opacidad + identifyCard; dragOver calcula highlight con una gran matriz booleana (movingValidCardToContainer / attachingValidCard); drop resuelve dZoneId+targetIndex → moveCardBundle o moveToDeckTop(si deckCover). Bloqueado para spectator y replay."
      hit_testing: "por event.target.tagName/id/parentElement (DIV=contenedor, IMG=carta) y flags .attached/.layer."
