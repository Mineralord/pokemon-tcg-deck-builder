state:
  systemState:
    ref: global-variables.js:17-48
    fields:
      coachingMode: "1p: ver ambas manos (entrenamiento)."
      isTwoPlayer: "modo online 2 jugadores."
      isReplay/replayActionData: "reproducción."
      turn: "contador de turno (take-turn.js lo incrementa)."
      selfCounter/oppCounter/spectatorCounter: "secuencias monotónicas para ordenar/deduplicar acciones."
      selfActionData/oppActionData: "logs para undo local."
      exportActionData: "log 'canónico' con perspectiva invertida para spectator/replay/export."
      initiator (getter): "lado inferior."
      roomId, p2SelfUsername, p2OppUsername, spectatorUsername, spectatorId
      selfDeckData/p1OppDeckData/p2OppDeckData: "listas de mazo (quantity,name,type,url)."
      cardBackSrc/p1OppCardBackSrc/p2OppCardBackSrc: "dorsos por lado."
    ownership: "Singleton mutable global; cualquier módulo lo importa y muta. Sin encapsulación."
  selection_model:
    ref: global-variables.js:57-71
    mouseClick: "{cardIndex, zoneId, cardUser, playContainer, selectingCard, isActiveZone, get card()}. Una sola carta 'seleccionada' → habilita keybinds y click-to-move."
  zone_model:
    ref: get-zone.js
    zones: [deck, lostZone, discard, prizes, active, bench, hand, attachedCards, viewCards, board, stadium(neutral)]
    special: "attachedCards/viewCards = zonas-popup temporales (ver cartas adjuntas / mirar N cartas). board = zona de juego temporal (cartas boca abajo, p.ej. supporter). deckCover/discardCover/lostZoneCover = 'tapas' (la carta superior representa la pila)."
  ownership_matrix:
    - {state: "posición/visibilidad de carta", owner: DOM, writers: "acciones (moveCard, reveal/hide, counters)", readers: "todo", sync: "vía replay de acciones"}
    - {state: "orden lógico por zona", owner: "arrays get-zone", writers: moveCard, readers: acciones, sync: "refreshBoard normaliza tras cada move"}
    - {state: "secuencia/logs", owner: systemState, writers: processAction, readers: "socket listeners, undo, spectator", sync: "counters + resync"}

# -------------------------------------------------------------------------------------
netcode:
  transport: {lib: "Socket.IO (CDN)", url: "https://ptcgsim.online", recovery: "connectionStateRecovery:{}"}
  server:
    ref: server/server.js
    role: "RELÉ puro (broadcast a la sala) + 3 extras. NO valida jugadas, NO conoce reglas."
    extras:
      persistence: "storeGameState → SQLite KeyValuePairs → clave 4 chars → URL compartible /import?key=. Límite 15GB."
      rooms: "roomInfo Map<roomId,{players:Set,spectators:Set}>; máx 2 jugadores; roomReject si lleno; limpieza de salas vacías cada 5min."
      reconnection: "joinGame/userReconnected/userDisconnected; disconnectHandler."
    relayed_events: [leaveRoom, requestAction, pushAction, resyncActions, catchUpActions, syncCheck, appendMessage, spectatorActionData, initiateImport, endImport, lookAtCards, stopLookingAtCards, revealCards, hideCards, revealShortcut, hideShortcut, lookShortcut, stopLookingShortcut]
  protocol_evolution:
    finding: "REFACTOR clave: ~40 eventos granulares (draw, moveCardBundle, attack, addDamageCounter…) están COMENTADOS en server.js:245-293 y socket-event-listeners.js:260-461. Fueron sustituidos por un ENVELOPE genérico."
    from: "un evento socket por tipo de acción."
    to: "pushAction/requestAction {action, counter, roomId, parameters} + acceptAction(action→función)."
    benefit: "Añadir una acción nueva NO requiere tocar el servidor ni registrar un evento; entra sola por el envelope + el mapa `functions`."
    confidence: high
  outbound_processAction:
    ref: setup/general/process-action.js
    logic: >
      Al final de CADA acción mutadora. Guarda si !isUndoInProgress && emit && !spectator.
      Loguea a self/opp ActionData + incrementa self/oppCounter. Emite:
      self+2p → 'pushAction'{counter:selfCounter}; mover carta del rival en 2p → 'requestAction'{counter:oppCounter}
      (pide al rival que ejecute la acción sobre SUS cartas). Además push a exportActionData con
      parameters[0] invertido self↔opp (perspectiva del espectador).
  inbound:
    ref: socket-event-listeners.js
    pushAction: "si counter==oppCounter+1 → oppCounter++, acceptAction('opp'). Si counter>oppCounter+1 → HUECO → emit resyncActions."
    requestAction: "si counter==selfCounter → acceptAction('self') (ejecuto la jugada que el rival pidió sobre mis cartas)."
    syncCheck: "cada 3s cada cliente emite su selfCounter; el receptor pide resync si detecta que va por detrás."
    resyncActions/catchUpActions: "recuperación: catchUpActions(log) aplica sólo los que faltan (slice desde oppCounter) y es listo con checkpoints reset/setup/deckData para no re-aplicar toda la historia."
    reconnect: "on 'connect' → userReconnected + resyncActions."
    spectatorActionData: "cada 1s los jugadores emiten exportActionData completo; el espectador lo replica (y flipa perspectiva con socketId==spectatorId)."
  acceptAction:
    ref: setup/general/accept-action.js
    mechanism: "map `functions` (nombre→función). emit = (user==='self' || isStateImport). Llama fn(user, ...parameters, emit). Bloqueado por replay."
  event_sourcing:
    undo:
      ref: actions/general/undo.js
      mechanism: "Re-deriva estado: filtra el log (quita la última entrada, colapsa pares undo, reemplaza deck-exchange por reset), y REPLAYEA desde el último checkpoint reset/setup. Sin operaciones inversas. Async con estado 'Loading...' + repaint. En 2p, undo es una acción pedida al peer."
    log_cap:
      ref: setup/general/add-action-data.js:1
      note: "MAX_SIZE=30 (ventana deslizante). OJO: addToActionData reasigna variables locales → el cap NO surte efecto sobre el llamador (bug latente). Limita profundidad de undo/replay; checkpoints reset/setup anclan catch-up."
    replay: "isReplay bloquea drag y ciertas acciones (replay-block.js). Reproduce exportActionData."
  desync_mitigation:
    refreshBoard:
      ref: setup/sizing/refresh-board.js, move-card-bundle.js:40
      note: "Tras CADA movimiento se re-appendan active/bench vía moveCard para normalizar el orden de arrays entre ambos clientes (evita que flip/resize desincronice arrays). Reasserta rotaciones. Síntoma de fragilidad del modelo DOM-como-estado."
  comparison_authority_model:
    ptcgsim: "P2P, sin autoridad, sin motor, sin enforcement de info oculta (honor system + manual). Ventaja: soporta CUALQUIER carta/interacción sin programarla. Desventaja: desyncs, trampas posibles, cero automatización, sin IA."
    tcg_live_clone: "Host-autoritativo con motor determinista; snapshots censurados por perspectiva (GameState.toDtoFor). Ventaja: correcto, seguro, automatizable (IA PvE). Desventaja: cada efecto de carta debe codificarse."

