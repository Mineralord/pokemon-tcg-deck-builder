    ref: click-events.js:63, card-context-menu/**
    mechanism: "openCardContextMenu construye el menú togglando visibilidad de botones vía `buttonConditions` map keyed por (userCondition selfView/oppView, zoneId). Se posiciona relativo a la carta compensando offset de iframe y perspectiva. Oculto para spectator; filtrado por replay."
